services:
  # ── 1. Node.js Application ──────────────────────────────────────────────────
  # Kept awake by an external cron-job.org job hitting /health every 5 minutes.
  # Render cron jobs have no free plan, and the free tier's 750 instance-hours a
  # month cover one always-on service, so Prometheus and Grafana are left to sleep.
  - type: web
    name: ci-cd-pipeline-automation-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"

  # ── 2. Prometheus Server ────────────────────────────────────────────────────
  - type: web
    name: prometheus-monitoring-service
    runtime: docker
    dockerfilePath: Dockerfile.prometheus
    plan: free
    healthCheckPath: /-/healthy
    envVars:
      - key: PROMETHEUS_STORAGE_PATH
        value: /tmp/prometheus

  # ── 3. Grafana Dashboard ────────────────────────────────────────────────────
  - type: web
    name: grafana-dashboard-service
    runtime: docker
    dockerfilePath: Dockerfile.grafana
    plan: free
    envVars:
      - key: PROMETHEUS_URL
        value: https://prometheus-monitoring-service.onrender.com
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      # A public Grafana must not ship admin/admin; Render generates a random
      # password (visible under the service's Environment tab).
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
        value: /var/lib/grafana/dashboards/nodejs-overview.json
