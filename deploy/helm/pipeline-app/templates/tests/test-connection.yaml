apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pipeline-app.fullname" . }}-test"
  labels:
    {{- include "pipeline-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "GET /health"
          wget -qO- "http://{{ include "pipeline-app.fullname" . }}:{{ .Values.service.port }}/health" | grep -q healthy
          echo "GET /ready"
          wget -qO- "http://{{ include "pipeline-app.fullname" . }}:{{ .Values.service.port }}/ready" | grep -q ready
          echo "GET /metrics exposes the request counter"
          wget -qO- "http://{{ include "pipeline-app.fullname" . }}:{{ .Values.service.port }}/metrics" | grep -q http_requests_total
          echo OK
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
