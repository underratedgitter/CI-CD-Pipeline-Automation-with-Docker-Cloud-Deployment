name: CI/CD Pipeline

# Pull requests and manual runs check everything, including building the
# image, testing it in a browser and on a real Kubernetes cluster. Only a push
# to main publishes and deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ci-cd-pipeline-app
  HELM_VERSION: v3.22.1

# One run per branch at a time. On main a newer push waits: two overlapping helm
# upgrades on the same release leave it stuck in pending-upgrade and need a
# manual rollback to clear. On a pull request a newer push replaces the check.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # checkout; every job that needs more asks for it itself

# Actions are pinned to full commit SHAs, with the release as a comment, and
# container tools to image digests. A tag is a pointer its owner (or whoever
# compromises them) can move; a SHA is the exact code that was reviewed.
# Dependabot keeps the pins current (.github/dependabot.yml).

jobs:
  # ── 0. Which optional targets are configured ─────────────────────────────────
  # The secrets context is not available in a job-level `if`, so the checks run
  # here as steps and the results are passed down as outputs. Without this a fork
  # or a fresh clone fails the pipeline on credentials it was never given.
  guard:
    name: Check configured targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      dockerhub: ${{ steps.check.outputs.dockerhub }}
      kubernetes: ${{ steps.check.outputs.kubernetes }}
      render: ${{ steps.check.outputs.render }}

    steps:
      - id: check
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          HAS_KUBERNETES: ${{ secrets.KUBE_CONFIG != '' }}
          HAS_RENDER: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          {
            echo "dockerhub=$HAS_DOCKERHUB"
            echo "kubernetes=$HAS_KUBERNETES"
            echo "render=$HAS_RENDER"
          } >> "$GITHUB_OUTPUT"

  # ── 1. The workflows themselves ──────────────────────────────────────────────
  # A workflow runs with the repository's token, so it is code worth linting:
  # actionlint for correctness (with shellcheck on every run: block), zizmor for
  # security (template injection, credential persistence, impostor commits).
  workflows:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e GH_TOKEN \
            ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --format=github .github/workflows

  # ── 2. Lint & Test ───────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      # --ignore-scripts: install scripts are how a compromised package runs
      # code on the runner. Nothing this project depends on needs one.
      - run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

  # ── 3. Security audit ────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # Runtime dependencies are what ships in the image, so a high or
      # critical advisory there blocks the build. Dev-only tooling is reported
      # without failing the job.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Every installed package must carry a valid registry signature, and
      # provenance where the package publishes it: a tarball swapped on the way
      # from the registry fails here.
      - name: Verify package signatures
        run: npm audit signatures

  # ── 3b. Portfolio ────────────────────────────────────────────────────────────
  # Lints and type-checks the portfolio on its own, so a failure names the
  # portfolio rather than surfacing as a failed Docker build.
  portfolio:
    name: Lint & Build Portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: portfolio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Verify package signatures
        run: npm audit signatures

      - name: Run linter
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  # ── 4. Chart ─────────────────────────────────────────────────────────────────
  # Renders the chart and checks the result against the real Kubernetes API
  # schemas. A chart that only gets validated at `helm upgrade` time is validated
  # against production.
  chart:
    name: Lint & Validate Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint both value sets
        run: |
          helm lint deploy/helm/pipeline-app --strict
          helm lint deploy/helm/pipeline-app --strict \
            --values deploy/helm/pipeline-app/values-prod.yaml

      - name: Render with every optional object switched on
        run: |
          helm template pipeline-app deploy/helm/pipeline-app \
            --namespace pipeline \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.prometheusRule.enabled=true \
            --set networkPolicy.enabled=true \
            > rendered.yaml

      # ServiceMonitor and PrometheusRule are CRDs and have no schema in the
      # upstream catalogue; -ignore-missing-schemas skips those two rather than
      # failing on them. Every core object is checked strictly.
      - name: Validate against the Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0 rendered.yaml

      - name: Scan the rendered manifests for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered.yaml
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  # ── 4b. Monitoring config ────────────────────────────────────────────────────
  # Alert rules are code that only runs during an incident, which is the worst
  # time to find out a selector matches nothing. promtool checks the config and
  # both rule sets, and unit-tests the deployed rules with synthetic series.
  observability:
    name: Validate Monitoring Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # The same Prometheus version Dockerfile.prometheus deploys, so the rules
      # are checked and tested by the engine that will evaluate them.
      PROMTOOL: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Prometheus config and its rules
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" -w /p "$PROMTOOL" check config prometheus.yml

      - name: Unit-test the alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" -w /p "$PROMTOOL" test rules tests/alert_rules_test.yml

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check the chart's PrometheusRule
        run: |
          set -euo pipefail
          helm template pipeline-app deploy/helm/pipeline-app --namespace pipeline \
              --set monitoring.prometheusRule.enabled=true \
              --show-only templates/prometheusrule.yaml \
            | docker run --rm -i mikefarah/yq:4@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e '.spec' \
            > chart-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD:/p" -w /p "$PROMTOOL" check rules chart-rules.yml

      - name: Grafana dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done

  # ── 5. Build and test the image ──────────────────────────────────────────────
  # Runs on pull requests too, so an image that builds but does not start, or a
  # page the CSP breaks, is caught before merge. The tested image is saved, and
  # everything after this job uses exactly that image rather than a rebuild.
  image:
    name: Build & Test Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [workflows, test, security, portfolio, chart, observability]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only the OCI labels (source, revision, created); tags are set at publish.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pipeline-app:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the container
        run: bash tests/smoke.sh pipeline-app:ci

      - name: Render the portfolio in Chrome under the real CSP
        run: |
          docker run --detach --name browser-check --publish 127.0.0.1:3999:3000 pipeline-app:ci
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3999/health && break; sleep 1; done
          bash tests/browser/csp-check.sh http://127.0.0.1:3999

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pipeline-app:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      # Blocks only on what can be fixed: a finding with no released fix would
      # fail every run without anything to act on.
      - name: Block on fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pipeline-app:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Keep the tested image
        run: docker save pipeline-app:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # ── 6. Kubernetes integration test ───────────────────────────────────────────
  # The chart installed on a real three-node cluster (kind), then exercised:
  # the chart's own tests, and a full rollout under continuous traffic that
  # fails on a single dropped request. Nothing is published unless this passes.
  kubernetes:
    name: Kubernetes Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: image

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the tested image
        run: gunzip -c image.tar.gz | docker load

      - name: Create a three-node cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          config: deploy/kind/cluster.yaml
          cluster_name: pipeline
          wait: 180s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the chart with the tested image
        run: |
          set -euo pipefail
          kind load docker-image pipeline-app:ci --name pipeline
          helm upgrade --install pipeline-app deploy/helm/pipeline-app \
            --namespace pipeline --create-namespace \
            --set image.repository=pipeline-app \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --wait --timeout 3m

      - name: Run the chart's tests
        run: helm test pipeline-app --namespace pipeline --logs

      - name: Roll every pod under continuous traffic
        run: bash deploy/kind/zero-downtime-test.sh pipeline pipeline-app

      - name: Show what went wrong
        if: failure()
        run: |
          kubectl -n pipeline get deploy,rs,pod,svc,pdb,hpa -o wide || true
          kubectl -n pipeline describe pods || true
          kubectl -n pipeline get events --sort-by=.lastTimestamp || true
          kubectl -n pipeline logs -l app.kubernetes.io/instance=pipeline-app --tail=100 --all-containers || true

  # ── 7. Publish ───────────────────────────────────────────────────────────────
  # Pushes the exact image that passed every test, generates its SBOM, and
  # attaches signed build provenance (SLSA) and the SBOM to it in the registry.
  # Anyone can verify both:
  #   gh attestation verify oci://ghcr.io/<owner>/ci-cd-pipeline-app:latest --owner <owner>
  publish:
    name: Publish Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [guard, image, kubernetes]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless Sigstore signing of the attestations
      attestations: write # store the attestations
      security-events: write # upload the image scan to the Security tab

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the tested image
        run: gunzip -c image.tar.gz | docker load

      # GHCR authenticates with the token the workflow already has, so pushing
      # needs no stored registry password at all.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, tagged with the commit and latest
        id: push
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')   # registry paths must be lowercase
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag pipeline-app:ci "$image:$tag"
            docker push --quiet "$image:$tag"
          done
          ref=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' pipeline-app:ci \
            | grep "^$image@sha256:" | head -n 1 || true)
          digest=${ref#*@}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $image after push"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pipeline-app:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

      # create-storage-record needs an organisation-owned repository.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Scan the published image for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pipeline-app:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Log in to Docker Hub
        if: needs.guard.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        if: needs.guard.outputs.dockerhub == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          image="docker.io/$(printf '%s' "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')/ci-cd-pipeline-app"
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag pipeline-app:ci "$image:$tag"
            docker push --quiet "$image:$tag"
          done
          echo "Also published to \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 8. Deploy to Kubernetes ──────────────────────────────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [guard, publish]
    if: github.event_name == 'push' && needs.guard.outputs.kubernetes == 'true'

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'pipeline' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Through env, not ${{ }} in the script: an expression is pasted into the
      # shell source before it runs, so a secret would become code.
      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          install -m 700 -d "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Deployed by digest. A tag is a pointer someone can move; a digest is the
      # image that was tested on kind two jobs ago and nothing else.
      - name: Deploy
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install pipeline-app deploy/helm/pipeline-app \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values deploy/helm/pipeline-app/values-prod.yaml \
            --set image.repository="$image" \
            --set image.digest="$DIGEST" \
            --atomic \
            --timeout 5m
        # --atomic rolls back to the previous release if the new pods never go
        # ready, so a bad deploy leaves the last working version serving instead
        # of a half-migrated one.

      - name: Verify with the chart's own tests
        run: helm test pipeline-app --namespace "$NAMESPACE" --logs

      - name: Report what is running
        if: always()
        run: kubectl -n "$NAMESPACE" get deploy,pod,hpa -o wide || true

      - name: Remove cluster credentials
        if: always()
        run: rm -f "$HOME/.kube/config"

  # ── 9. Deploy to Render ──────────────────────────────────────────────────────
  # What the public demo runs on. Render builds its own image from the
  # Dockerfile, so this waits for publish only so that nothing deploys unless
  # the tested image passed, then waits for the pushed commit to be live.
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [guard, publish]
    if: github.event_name == 'push' && needs.guard.outputs.render == 'true'

    environment:
      name: render
      url: ${{ vars.RENDER_URL || 'https://ci-cd-pipeline-automation-app.onrender.com' }}

    steps:
      # Full history, so a newer commit already live can be recognised as
      # containing this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The hook must belong to the service at RENDER_URL: the wait below
      # checks that URL, so a hook for any other service times out there.
      # ref= deploys exactly the commit this run tested, not whatever is newest
      # on main by the time Render picks it up.
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          case "$HOOK_URL" in
            *\?*) deploy_url="$HOOK_URL&ref=$GITHUB_SHA" ;;
            *)    deploy_url="$HOOK_URL?ref=$GITHUB_SHA" ;;
          esac
          code=$(curl --silent --output /dev/null --max-time 30 --write-out '%{http_code}' "$deploy_url") || code=000
          # Render answers 200 when it starts a deploy and 202 when it queues one
          # (for example behind the auto-deploy a push already started). Both
          # mean the deploy was accepted; anything outside 2xx is a real failure.
          case "$code" in
            2??) echo "Render deploy triggered (HTTP $code)" ;;
            *)   echo "::error::Render hook returned HTTP $code"; exit 1 ;;
          esac

      # Waiting for /health alone passes on the old version, which keeps
      # answering while Render builds. /info reports the commit actually served
      # (Render's RENDER_GIT_COMMIT), so this waits for that to be ours, or a
      # newer commit that already contains ours.
      - name: Wait for this commit to be live
        env:
          URL: ${{ vars.RENDER_URL || 'https://ci-cd-pipeline-automation-app.onrender.com' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            revision=$(curl --silent --max-time 30 "$URL/info" | jq -r '.revision // empty' 2>/dev/null) || revision=""
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "Commit $GITHUB_SHA is live (attempt $i)"
              echo "Live on Render: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ $revision =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --quiet origin "$revision" 2>/dev/null || true
              if git merge-base --is-ancestor "$GITHUB_SHA" "$revision" 2>/dev/null; then
                echo "A newer commit containing this one is live: $revision"
                exit 0
              fi
            fi
            echo "attempt $i: serving ${revision:-nothing yet}"
            sleep 15
          done
          echo "::error::$GITHUB_SHA was not live within ten minutes (last: ${revision:-no answer}). If Render did deploy, check that RENDER_DEPLOY_HOOK_URL is the hook of the service at $URL."
          exit 1
