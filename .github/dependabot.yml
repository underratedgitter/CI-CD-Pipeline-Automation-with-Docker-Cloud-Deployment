# Keeps every pinned dependency current: the SHA-pinned actions, both npm
# lockfiles, the Dockerfiles and docker-compose.yml.
#
# Minor and patch updates are grouped into one pull request per ecosystem.
# Major updates arrive one per pull request: a major can break things (ESLint
# 10 dropped the old config format), and grouped with safe patches it blocks
# all of them behind one migration.
#
# cooldown: a release is only proposed once it has been public for a few days.
# Hijacked packages are usually caught and pulled within that window, so a
# compromised version is unlikely to ever reach a pull request here.
#
# None of these are security fixes; those come separately as Dependabot
# security updates, enabled in the repository's Security settings.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: npm
    directory: /portfolio
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      portfolio:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Odd Node majors are never LTS and reach end of life six months after
      # release (Node 25 was proposed here, then went EOL with unpatched
      # OpenSSL). Moving to the next LTS major is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
