# ── Global settings ────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s       # How often Prometheus scrapes targets
  evaluation_interval: 15s   # How often alert rules are evaluated

# ── Alert rules ────────────────────────────────────────────────────────────────
rule_files:
  - 'alert_rules.yml'

# ── Scrape targets ─────────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node.js app — only reachable via Docker Compose locally (my-app:3000)
  # Commented out: this target fails on Render since 'my-app' is a Compose-only hostname.
  # Uncomment when running locally with docker-compose up.
  # - job_name: 'node-app'
  #   static_configs:
  #     - targets: ['my-app:3000']
  #   metrics_path: '/metrics'

  # Live production cloud deployment on Render
  - job_name: 'render-app'
    scheme: https
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'ci-cd-pipeline-automation-app.onrender.com'
          - 'ci-cd-pipeline-automation-with-docker.onrender.com'


